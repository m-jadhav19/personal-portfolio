<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="brand">
      <h2>Signal Field</h2>
      <p>Cursor Theremin</p>
    </div>

    <div id="hud">
      <div><span class="label">Pitch</span> <span id="freqVal">—</span> Hz</div>
      <div><span class="label">Filter</span> <span id="cutVal">—</span> Hz</div>
      <div class="note"><span class="label">Note</span> <span id="noteVal">—</span></div>
    </div>

    <button id="mute" type="button">Mute</button>

    <div id="overlay">
      <h1>Signal Field</h1>
      <div class="sub">Point Elegance / Vector Instrument</div>
      <p class="desc">
        Move your cursor across the field. X bends pitch, Y opens the filter, speed
        drives the swell — the particles ripple with you.
      </p>
      <div class="enter">Click to begin</div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
