<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 1️⃣ Favicon - 16x16 -->
  <symbol id="avatar-favicon" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="4" y="0" width="8" height="2" fill="#2B1B17"/>
    <rect x="3" y="2" width="10" height="1" fill="#2B1B17"/>
    <rect x="4" y="3" width="8" height="4" fill="#C37553"/>
    <rect x="3" y="4" width="2" height="1" fill="#231F20"/>
    <rect x="11" y="4" width="2" height="1" fill="#231F20"/>
    <rect x="5" y="5" width="6" height="1" fill="#231F20"/>
    <rect x="4" y="7" width="8" height="2" fill="#2B1B17"/>
    <rect x="2" y="9" width="12" height="5" fill="#C0392B"/>
  </symbol>

  <!-- 2️⃣ Square Avatar - 32x32 -->
  <symbol id="avatar-square" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect width="32" height="32" fill="transparent"/>
    <rect x="10" y="2" width="12" height="3" fill="#2B1B17"/>
    <rect x="9" y="5" width="14" height="1" fill="#2B1B17"/>
    <rect x="10" y="6" width="12" height="6" fill="#C37553"/>
    <rect x="9" y="8" width="3" height="2" fill="#231F20"/>
    <rect x="20" y="8" width="3" height="2" fill="#231F20"/>
    <rect x="12" y="9" width="8" height="1" fill="#231F20"/>
    <rect x="15" y="10" width="2" height="1" fill="#C37553"/>
    <rect x="10" y="12" width="12" height="6" fill="#2B1B17"/>
    <rect x="8" y="8" width="1" height="3" fill="#C37553"/>
    <rect x="23" y="8" width="1" height="3" fill="#C37553"/>
    <rect x="6" y="18" width="20" height="8" fill="#C0392B"/>
    <rect x="12" y="18" width="8" height="2" fill="#992E24"/>
  </symbol>

  <!-- 3️⃣ Detailed Avatar - 48x48 -->
  <symbol id="avatar-detailed" viewBox="0 0 48 48" shape-rendering="crispEdges">
    <rect width="48" height="48" fill="transparent"/>
    <rect x="14" y="4" width="20" height="4" fill="#2B1B17"/>
    <rect x="12" y="8" width="24" height="2" fill="#2B1B17"/>
    <rect x="16" y="10" width="16" height="2" fill="#2B1B17"/>
    <rect x="14" y="12" width="20" height="8" fill="#C37553"/>
    <rect x="20" y="14" width="8" height="4" fill="#E09A7F"/>
    <rect x="12" y="16" width="5" height="3" fill="#231F20"/>
    <rect x="31" y="16" width="5" height="3" fill="#231F20"/>
    <rect x="17" y="17" width="14" height="1" fill="#231F20"/>
    <rect x="14" y="17" width="2" height="1" fill="#F3DFC8"/>
    <rect x="33" y="17" width="2" height="1" fill="#F3DFC8"/>
    <rect x="22" y="18" width="4" height="2" fill="#C37553"/>
    <rect x="12" y="20" width="24" height="10" fill="#2B1B17"/>
    <rect x="16" y="26" width="16" height="2" fill="#2B1B17"/>
    <rect x="10" y="16" width="2" height="4" fill="#C37553"/>
    <rect x="36" y="16" width="2" height="4" fill="#C37553"/>
    <rect x="8" y="30" width="32" height="12" fill="#C0392B"/>
    <rect x="20" y="30" width="8" height="4" fill="#992E24"/>
  </symbol>

  <!-- 4️⃣ Monochrome -->
  <symbol id="avatar-glyph" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <g fill="#111">
      <rect x="10" y="2" width="12" height="3"/>
      <rect x="9" y="5" width="14" height="1"/>
      <rect x="10" y="6" width="12" height="6"/>
      <rect x="9" y="8" width="3" height="2"/>
      <rect x="20" y="8" width="3" height="2"/>
      <rect x="12" y="9" width="8" height="1"/>
      <rect x="10" y="12" width="12" height="6"/>
      <rect x="6" y="18" width="20" height="8"/>
    </g>
  </symbol>

  <!-- 5️⃣ Badge -->
  <symbol id="avatar-badge" viewBox="0 0 32 32" shape-rendering="crispEdges">
    <rect x="1" y="1" width="30" height="30" fill="#08202A"/>
    <g fill="#E6F7FA">
      <rect x="10" y="3" width="12" height="3"/>
      <rect x="9" y="6" width="14" height="1"/>
      <rect x="10" y="7" width="12" height="6"/>
      <rect x="9" y="9" width="3" height="2"/>
      <rect x="20" y="9" width="3" height="2"/>
      <rect x="12" y="10" width="8" height="1"/>
      <rect x="10" y="12" width="12" height="6"/>
      <rect x="6" y="18" width="20" height="8"/>
    </g>
  </symbol>
</svg>
